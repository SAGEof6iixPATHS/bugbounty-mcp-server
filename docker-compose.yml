services:
  bugbounty-mcp:
    build:
      context: .
    image: bugbounty-mcp:2.0.0
    command:
      - serve
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "3001"
      - --allow-remote
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SAFE_MODE: ${SAFE_MODE:-true}
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-}
      BLOCKED_TARGETS: ${BLOCKED_TARGETS:-}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-5}
      DEFAULT_TIMEOUT: ${DEFAULT_TIMEOUT:-15}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-2}
      TOOL_TIMEOUT: ${TOOL_TIMEOUT:-300}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-200000}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-30}
      MAX_PORTS_PER_SCAN: ${MAX_PORTS_PER_SCAN:-1024}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-1000000}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-5}
      MAX_CRAWL_DEPTH: ${MAX_CRAWL_DEPTH:-2}
      MAX_PAGES_TO_CRAWL: ${MAX_PAGES_TO_CRAWL:-30}
      MAX_DIRECTORY_REQUESTS: ${MAX_DIRECTORY_REQUESTS:-100}
      ENABLE_NUCLEI: "false"
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 3001), 2).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
